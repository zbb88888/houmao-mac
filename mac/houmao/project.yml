name: houmao
options:
  bundleIdPrefix: cn.com.houmao
targets:
  houmao:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources: [houmao]
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies: []
    postCompileScripts:
      - name: Bundle houmao-engine (Rust)
        # 构建 Rust 引擎并拷进 app 的 Resources（在签名前），让 make build/install 自带引擎。
        script: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"
          ENGINE_DIR="$SRCROOT/../../engine"
          cargo build --release --manifest-path "$ENGINE_DIR/Cargo.toml"
          RES="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$RES"
          cp -f "$ENGINE_DIR/target/release/houmao-engine" "$RES/houmao-engine"
        basedOnDependencyAnalysis: false

  houmaoTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources: [houmaoTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: houmao

  houmaoUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources: [houmaoUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: houmao
