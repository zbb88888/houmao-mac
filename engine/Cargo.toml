[package]
name = "houmao-engine"
version = "0.1.0"
edition = "2021"
description = "houmao 无头 LLM/agent 引擎：Unix socket + 长度前缀 CBOR 协议"
license = "MIT"

[[bin]]
name = "houmao-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
ureq = "2"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"     # 体积优先
lto = true
codegen-units = 1
panic = "abort"
strip = true
